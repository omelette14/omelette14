<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookAtMe Backoffice — QR Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <img src="logo.svg" alt="LookAtMe" class="header-logo">
      <div class="header-title">
        <span class="header-app">Backoffice</span>
        <span class="header-sub">Generatore QR Code</span>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- Generator -->
    <section class="section generator-grid">

      <!-- Form -->
      <div class="card form-card">
        <h2 class="card-title">Nuovo QR Code</h2>
        <form id="qrForm" autocomplete="off">
          <div class="field">
            <label for="struttura">Struttura</label>
            <input type="text" id="struttura" placeholder="es. OzzanoPaddle" required>
          </div>
          <div class="field">
            <label for="numerocampo">Numero Campo</label>
            <input type="number" id="numerocampo" placeholder="es. 1" min="1" required>
          </div>
          <div class="url-box" id="urlBox" hidden>
            <span class="url-label">URL generato</span>
            <span id="urlText" class="url-value"></span>
          </div>
          <button type="submit" class="btn btn-black btn-full">
            Genera QR Code
          </button>
        </form>
      </div>

      <!-- Preview -->
      <div class="card preview-card" id="previewCard" hidden>
        <h2 class="card-title">Anteprima</h2>
        <div class="qr-wrap">
          <canvas id="qrCanvas"></canvas>
        </div>
        <p class="preview-meta" id="previewMeta"></p>
        <div class="btn-row">
          <button class="btn btn-green" onclick="saveQR()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Salva nel Database
          </button>
          <button class="btn btn-outline" onclick="downloadPNG()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            PNG
          </button>
          <button class="btn btn-outline" onclick="downloadPDF()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            PDF
          </button>
        </div>
      </div>

    </section>

    <!-- History -->
    <section class="card history-card">
      <div class="history-top">
        <h2 class="card-title">QR Code Salvati</h2>
        <button class="btn btn-sm" onclick="loadHistory()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          Aggiorna
        </button>
      </div>
      <div id="qrList">
        <p class="empty">Nessun QR code salvato</p>
      </div>
    </section>

  </main>

  <div id="toast" class="toast"></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
