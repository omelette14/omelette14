<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 510">

  <!-- Outer black eye/lens shape -->
  <path d="M25,192 C100,43 400,43 475,192 C400,341 100,341 25,192 Z" fill="#000"/>

  <!-- Inner white cutout — creates the thick border/stroke effect -->
  <path d="M72,192 C138,82 362,82 428,192 C362,302 138,302 72,192 Z" fill="#fff"/>

  <!-- Large black filled circle (iris) -->
  <circle cx="250" cy="192" r="90" fill="#000"/>

  <!-- White left-pointing triangle inside circle -->
  <polygon points="285,132 285,252 168,192" fill="#fff"/>

  <!-- ® Registered trademark — top right corner -->
  <circle cx="458" cy="44" r="23" fill="none" stroke="#000" stroke-width="3.5"/>
  <text x="458" y="52"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="bold"
    text-anchor="middle"
    fill="#000">R</text>

  <!-- LookAtMe bold text -->
  <text x="250" y="488"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#000">LookAtMe</text>

</svg>
